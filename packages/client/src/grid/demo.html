<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>A5 grid demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10151c; overflow: hidden; }
      .table { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #hud {
        position: fixed; top: 8px; left: 8px; color: #cfe2ff; font: 13px monospace;
        background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 6px; z-index: 50;
        white-space: pre; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="cv" class="table"></canvas>
    <div id="hud">A5 snap-grid demo</div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
